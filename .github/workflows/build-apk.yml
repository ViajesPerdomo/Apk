name: Construir APK de Viajes Perdomo

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de compilación (debug o release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 📦 Extraer ZIP si el proyecto fue subido comprimido
        run: |
          if [ -f "project.zip" ]; then
            echo "Detectado project.zip, descomprimiendo..."
            unzip -o project.zip -d .
          elif ls *.zip 1> /dev/null 2>&1; then
            ZIP_FILE=$(ls *.zip | head -n 1)
            echo "Detectado archivo $ZIP_FILE, descomprimiendo..."
            unzip -o "$ZIP_FILE" -d .
          else
            echo "Árbol git estándar detectado."
          fi

      - name: 🟢 Configurar Node.js 22 LTS (Requerido por Capacitor 8)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ☕ Configurar Java 21 (Temurin - Requerido por AGP 8.13+)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 📱 Aceptar licencias del SDK de Android
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 📦 Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: 🔨 Compilar aplicación web
        run: npm run build

      - name: 📱 Inicializar y Sincronizar Capacitor Android
        env:
          CI: true
          CAPACITOR_TELEMETRY: 0
        run: |
          npx cap telemetry off || true
          if [ ! -d "android" ] || [ ! -f "android/build.gradle" ]; then
            rm -rf android
            npx cap add android
          fi
          npx cap sync android

      - name: 🔧 Permisos de ejecución gradlew
        run: chmod +x android/gradlew

      - name: 🚀 Compilar APK con Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 🔍 Empaquetar APK y ZIP
        run: |
          mkdir -p output-apk
          APK_PATH=$(find android/app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          cp "$APK_PATH" output-apk/viajes-perdomo-debug.apk
          cd output-apk
          zip -r ../viajes-perdomo-apk-bundle.zip .
          cd ..

      - name: 📤 Subir APK a Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Viajes-Perdomo-APK
          path: output-apk/viajes-perdomo-debug.apk

      - name: 📤 Subir ZIP con APK
        uses: actions/upload-artifact@v4
        with:
          name: Viajes-Perdomo-APK-ZIP
          path: viajes-perdomo-apk-bundle.zip
