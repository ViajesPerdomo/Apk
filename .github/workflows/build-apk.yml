name: Construir APK de Viajes Perdomo

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de compilación (debug o release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 📦 Extraer ZIP si el proyecto fue subido comprimido
        run: |
          if [ -f "project.zip" ]; then
            echo "Detectado project.zip, descomprimiendo..."
            unzip -o project.zip -d .
          elif ls *.zip 1> /dev/null 2>&1; then
            ZIP_FILE=$(ls *.zip | head -n 1)
            echo "Detectado archivo $ZIP_FILE, descomprimiendo..."
            unzip -o "$ZIP_FILE" -d .
          else
            echo "Árbol git estándar detectado."
          fi

      - name: 🟢 Configurar Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ Configurar Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Instalar dependencias del proyecto
        run: |
          npm install --legacy-peer-deps

      - name: 🔨 Compilar aplicación web (Vite build)
        run: |
          npm run build

      - name: 📱 Inicializar y Sincronizar Capacitor Android
        env:
          CI: true
          CAPACITOR_TELEMETRY: 0
        run: |
          # Desactivar telemetría interactiva de Capacitor
          npx cap telemetry off || true

          # Si el directorio android no existe o está incompleto, inicializarlo
          if [ ! -d "android" ] || [ ! -f "android/build.gradle" ]; then
            echo "Inicializando proyecto Android nativo con Capacitor..."
            rm -rf android
            npx cap add android
          else
            echo "Directorio android nativo detectado y válido."
          fi

          # Sincronizar assets compilados con la plataforma Android
          echo "Sincronizando assets de dist/ hacia android/..."
          npx cap sync android

      - name: 🔧 Configurar permisos en gradlew
        run: |
          chmod +x android/gradlew

      - name: 🚀 Compilar APK con Gradle (assembleDebug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 🔍 Organizar APK para descarga
        run: |
          mkdir -p output-apk
          APK_FILE=$(find android/app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            echo "✅ APK generado con éxito: $APK_FILE"
            cp "$APK_FILE" output-apk/viajes-perdomo.apk
            cp "$APK_FILE" output-apk/app-debug.apk
            cd output-apk
            zip -r ../viajes-perdomo-apk.zip viajes-perdomo.apk app-debug.apk || true
            cd ..
          else
            echo "❌ Error: No se encontró el archivo APK compilado en android/app/build/outputs/apk/debug/"
            exit 1
          fi

      - name: 📤 Subir APK a GitHub Artifacts (Descarga directa)
        uses: actions/upload-artifact@v4
        with:
          name: Viajes-Perdomo-APK
          path: output-apk/viajes-perdomo.apk
          retention-days: 90

      - name: 📤 Subir archivo ZIP con el APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Viajes-Perdomo-APK-ZIP
          path: viajes-perdomo-apk.zip
          retention-days: 90
